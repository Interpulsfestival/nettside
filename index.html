/* Layout: dark festival ground, orange as the single signal colour, rhythm-of-dots motif from the logo, program shown as a timeline of "pulses" */
:root{
  --ink:#181818; --ink-2:#202020; --ink-3:#2b2b2b;
  --paper:#ffffff; --mist:#E3E4E3; --dim:#a3a29d; --dim-2:#74736f;
  --orange:#FAB161; --orange-deep:#e8994a;
  --line:rgba(255,255,255,.12);
  --f-display:"Museo Sans","Avenir Next","Avenir","Segoe UI",system-ui,sans-serif;
  --f-body:"Museo Sans","Avenir Next","Avenir","Segoe UI",system-ui,sans-serif;
  --gut:max(16px, env(safe-area-inset-left, 0px));
  --gut-r:max(16px, env(safe-area-inset-right, 0px));
  --wrap:1180px;
  --accent:#FAB161; --on-orange:#181818; --hdr:rgba(24,24,24,.92); --ghost-b:rgba(255,255,255,.5);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --ink:#F7F6F2; --ink-2:#EEECE6; --ink-3:#E2DFD8;
  --paper:#181818; --mist:#3b3a37; --dim:#66655f; --dim-2:#8d8b85;
  --accent:#A85A12; --orange-deep:#A85A12; --line:rgba(0,0,0,.13); --hdr:rgba(247,246,242,.94); --ghost-b:rgba(0,0,0,.45);
  color-scheme:light;
}
.force-dark{--ink:#181818;--ink-2:#202020;--ink-3:#2b2b2b;--paper:#fff;--mist:#E3E4E3;--dim:#a3a29d;--dim-2:#74736f;--accent:#FAB161;--orange-deep:#e8994a;--line:rgba(255,255,255,.12);--ghost-b:rgba(255,255,255,.5);color:var(--paper)}
.logo-l{display:none}
:root[data-theme="light"] .logo-d{display:none}
:root[data-theme="light"] .logo-l{display:block}
.force-dark .logo-d{display:block!important}.force-dark .logo-l{display:none!important}
*{box-sizing:border-box}
html,body{background:var(--ink);color:var(--paper)}
body{font-family:var(--f-body);font-weight:500;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit}
img{display:block;max-width:100%}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.05;letter-spacing:-.015em;margin:0;text-wrap:balance}
p{margin:0}
.wrap{max-width:var(--wrap);margin:0 auto;padding-left:var(--gut);padding-right:var(--gut-r)}
@media (min-width:700px){.wrap{padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:max(40px,env(safe-area-inset-right,0px))}}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.label{display:inline-block;background:var(--orange);color:var(--on-orange);font-weight:700;font-size:.85rem;padding:.35em .8em;letter-spacing:.01em}
.label b{font-weight:900}
.btn{display:inline-flex;align-items:center;gap:.5em;font:inherit;font-weight:700;font-size:.95rem;padding:.8em 1.25em;border:2px solid var(--orange);background:var(--orange);color:var(--on-orange);text-decoration:none;cursor:pointer;transition:background .15s,color .15s}
.btn:hover{background:transparent;color:var(--accent)}
.btn.ghost{background:transparent;color:var(--paper);border-color:var(--ghost-b)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
:focus-visible{outline:2px solid var(--orange);outline-offset:3px}

/* dots motif */
.dots{display:flex;gap:7px;align-items:center}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--orange);display:block}
.dots i.o{background:transparent;box-shadow:inset 0 0 0 1.5px var(--orange)}
.dots i.w{background:var(--paper)}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hdr);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;height:68px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.brand img{height:20px;width:auto}
.theme-btn{font:inherit;font-size:1rem;line-height:1;background:none;border:1px solid var(--line);color:var(--paper);width:36px;height:34px;cursor:pointer;display:grid;place-items:center}
nav.main{display:flex;gap:4px;margin-left:auto}
nav.main a{text-decoration:none;font-weight:700;font-size:.92rem;padding:.5em .6em;color:var(--mist);white-space:nowrap}
nav.main a:hover{color:var(--paper)}
.lang{flex:none}
nav.main a[aria-current="page"]{color:var(--accent)}
.lang{display:flex;border:1px solid var(--line)}
.lang button{font:inherit;font-size:.78rem;font-weight:700;letter-spacing:.06em;background:none;border:0;color:var(--dim);padding:.45em .6em;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.menu-btn{display:none;font:inherit;font-weight:700;background:none;border:1px solid var(--line);color:var(--paper);padding:.45em .8em;cursor:pointer}
.top .btn{padding:.55em 1em;font-size:.88rem;white-space:nowrap}
@media (max-width:1400px){.top .btn{display:none}}
@media (max-width:1240px){
  nav.main{display:none;position:absolute;left:0;right:0;top:68px;background:var(--ink);flex-direction:column;padding:8px var(--gut-r) 18px var(--gut);border-bottom:1px solid var(--line)}
  nav.main.open{display:flex}
  nav.main a{font-size:1.15rem;padding:.6em 0}
  .menu-btn{display:block;margin-left:auto}
  .top .btn{display:none}
}

/* pages */
.page{display:block}
.page[hidden]{display:none!important}
section{padding-block:72px}
@media (max-width:700px){section{padding-block:52px}}
.sec-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px 32px;margin-bottom:36px}
.sec-head h2{font-size:clamp(2rem,4.4vw,3.2rem)}
.sec-head p{max-width:46ch;color:var(--mist)}
.band-2{background:var(--ink-2)}
.band-light{background:var(--mist);color:var(--ink)}
.band-light .eyebrow{color:var(--ink)}
.band-orange{background:var(--orange);color:var(--on-orange)}

/* hero */
.hero{color:var(--paper);position:relative;min-height:min(86vh,820px);display:flex;align-items:flex-end;overflow:hidden;padding-block:0}
.hero .bg{position:absolute;inset:0}
.hero .bg img{width:100%;height:100%;object-fit:cover;object-position:50% 40%}
.hero .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(24,24,24,.35) 0%,rgba(24,24,24,.05) 35%,rgba(24,24,24,.55) 62%,var(--ink) 100%)}
.hero .wrap{position:relative;width:100%;padding-block:48px 56px}
.hero h1{font-size:clamp(3rem,10vw,8.4rem);line-height:.92;letter-spacing:-.035em;margin-block:18px 26px;max-width:11ch}
.hero h1 .gap{color:var(--accent)}
.hero-meta{display:flex;flex-wrap:wrap;gap:28px 48px;align-items:flex-end;justify-content:space-between}
.when{display:grid;gap:4px}
.when b{font-size:clamp(1.4rem,2.6vw,2rem);font-weight:700}
.when span{color:var(--mist)}
.cta-row{display:flex;flex-wrap:wrap;gap:12px}

/* three days strip */
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--ink)}
.day{background:var(--ink-2);padding:26px 24px 28px;display:grid;gap:10px;text-decoration:none;transition:background .15s;min-width:0}
.day:hover{background:var(--ink-3)}
.day .d{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.day h3{font-size:1.5rem}
.day p{color:var(--mist);font-size:.95rem}
@media (max-width:820px){.days{grid-template-columns:1fr}}

/* intro split */
.split{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}
.split > *{min-width:0}
.split h2{font-size:clamp(2rem,4vw,3rem);margin-block:14px 18px}
.split p+p{margin-top:14px}
.split .lead{font-size:1.2rem;color:var(--paper)}
.split p{color:var(--mist)}
.photo-stack{position:relative;aspect-ratio:4/5;max-width:100%}
.photo-stack img{position:absolute;object-fit:cover}
.photo-stack .a{inset:0 18% 22% 0;width:82%;height:78%}
.photo-stack .b{right:0;bottom:0;width:52%;height:46%;border:6px solid var(--ink)}
@media (max-width:860px){.split{grid-template-columns:1fr;gap:36px}}

/* format grid */
.formats{display:grid;grid-template-columns:repeat(3,1fr);gap:36px 40px}
.fmt{display:grid;gap:10px;align-content:start;border-top:3px solid var(--orange);padding-top:16px;min-width:0}
.fmt h3{font-size:1.25rem}
.fmt p{color:var(--mist);font-size:.98rem}
@media (max-width:860px){.formats{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.formats{grid-template-columns:1fr}}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:28px}
.stat{border-top:3px solid var(--ink);padding-top:14px;display:grid;gap:8px;min-width:0}
.stat .n{font-size:clamp(2.4rem,5vw,3.6rem);font-weight:900;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .t{font-size:.95rem;line-height:1.4}
@media (max-width:860px){.stats{grid-template-columns:1fr 1fr}}

/* quotes */
.quote-big{font-size:clamp(1.6rem,3.4vw,2.5rem);font-weight:700;line-height:1.2;letter-spacing:-.01em;max-width:30ch;text-wrap:balance}
.quote-big::before{content:"«";color:var(--orange-deep)}
.quote-big::after{content:"»";color:var(--orange-deep)}
.band-orange .quote-big::before,.band-orange .quote-big::after{color:var(--on-orange)}
cite{display:block;font-style:normal;font-weight:700;font-size:.92rem;margin-top:18px}
cite span{font-weight:500;opacity:.75}
.quotes{display:grid;grid-template-columns:repeat(2,1fr);gap:36px 48px;margin-top:52px}
.quotes blockquote{margin:0;display:grid;gap:4px;align-content:start;min-width:0}
.quotes p{font-size:1.15rem;line-height:1.4}
@media (max-width:760px){.quotes{grid-template-columns:1fr}}
.media-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:40px}
.media-list span{font-size:.82rem;font-weight:700;padding:.4em .8em;border:1.5px solid currentColor;border-radius:99px}

/* gallery teaser + gallery */
.mosaic{display:grid;grid-auto-flow:dense;grid-template-columns:repeat(6,1fr);grid-auto-rows:150px;gap:6px}
.mosaic figure{margin:0;position:relative;overflow:hidden;min-width:0}
.mosaic img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.mosaic figure:hover img{transform:scale(1.04)}
.mosaic .w2{grid-column:span 2}.mosaic .w3{grid-column:span 3}.mosaic .h2{grid-row:span 2}
@media (max-width:760px){.mosaic{grid-template-columns:repeat(2,1fr);grid-auto-rows:130px}.mosaic .w3,.mosaic .w2{grid-column:span 2}}

/* program */
.yearbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:40px}
.yearbar .lbl{font-size:.8rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-right:6px}
.yearbar button{font:inherit;font-weight:700;font-size:.92rem;padding:.45em .95em;background:none;color:var(--mist);border:1.5px solid var(--line);cursor:pointer;font-variant-numeric:tabular-nums}
.yearbar button:hover{border-color:var(--mist)}
.yearbar button[aria-pressed="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.notice{border-left:3px solid var(--orange);padding:.7em 1em;background:var(--ink-2);color:var(--mist);font-size:.95rem;margin-bottom:36px;max-width:70ch}
.dayblock{display:grid;grid-template-columns:180px 1fr;gap:28px;padding-block:34px;border-top:1px solid var(--line)}
.dayblock > *{min-width:0}
.dayblock .dname{position:sticky;top:96px;align-self:start;display:grid;gap:6px}
.dayblock .dname b{font-size:1.6rem;line-height:1}
.dayblock .dname span{color:var(--accent);font-size:.82rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.dayblock .dname em{font-style:normal;color:var(--dim);font-size:.9rem}
@media (max-width:760px){.dayblock{grid-template-columns:1fr;gap:16px}.dayblock .dname{position:static}}
.event{display:grid;grid-template-columns:200px 1fr;gap:24px;padding-bottom:30px;margin-bottom:30px;border-bottom:1px dashed var(--line)}
.event:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
.event > *{min-width:0}
.event .img{aspect-ratio:4/3;overflow:hidden}
.event .img img{width:100%;height:100%;object-fit:cover}
.event .time{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:700;font-size:.95rem}
.event h3{font-size:1.55rem;margin-block:4px 8px}
.event .who{color:var(--mist);font-size:.92rem;margin-bottom:10px}
.event .desc{color:var(--mist);max-width:62ch}
.pulses{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:0;max-width:62ch}
.pulses li{display:grid;grid-template-columns:62px 72px 1fr;gap:10px;padding:.55em 0;border-top:1px solid var(--line);font-size:.95rem}
.pulses li .t{font-variant-numeric:tabular-nums;color:var(--dim)}
.pulses li .p{font-weight:700;color:var(--accent);font-size:.8rem;letter-spacing:.08em;padding-top:.15em}
@media (max-width:520px){.pulses li{grid-template-columns:52px 1fr}.pulses li .p{display:none}}
.event .acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}
.tag{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:.3em .6em;border:1.5px solid var(--accent);color:var(--accent)}
.tag.sold{background:var(--orange);border-color:var(--orange);color:var(--on-orange)}
.event .btn{padding:.55em 1em;font-size:.88rem}
@media (max-width:760px){.event{grid-template-columns:1fr;gap:14px}.event .img{aspect-ratio:16/9}}
.highlights{display:grid;grid-template-columns:repeat(2,1fr);gap:20px 40px}
.highlights > div{border-top:3px solid var(--orange);padding-top:12px;display:grid;gap:6px;min-width:0}
.highlights h3{font-size:1.2rem}
.highlights p{color:var(--mist);font-size:.96rem}
@media (max-width:700px){.highlights{grid-template-columns:1fr}}

/* contributors */
.people{display:grid;grid-template-columns:repeat(3,1fr);gap:40px 32px}
.person{display:grid;gap:10px;align-content:start;min-width:0}
.person .ph{aspect-ratio:4/3;background:var(--ink-3);overflow:hidden;position:relative}
.person .ph img{width:100%;height:100%;object-fit:cover}
.person .ph .mono{position:absolute;inset:0;display:grid;place-items:center;font-size:2.4rem;font-weight:900;color:var(--dim-2);letter-spacing:-.02em}
.person .role{font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.person h3{font-size:1.3rem}
.person p{color:var(--mist);font-size:.95rem}
.person details{color:var(--mist);font-size:.95rem}
.person summary{cursor:pointer;font-weight:700;color:var(--paper);font-size:.88rem}
@media (max-width:900px){.people{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.people{grid-template-columns:1fr}}
.ensemble{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin-top:28px}
.ensemble div{background:var(--ink-2);padding:16px 16px 18px;display:grid;gap:4px;min-width:0}
.ensemble b{font-size:1rem}
.ensemble span{color:var(--dim);font-size:.88rem}
@media (max-width:760px){.ensemble{grid-template-columns:1fr 1fr}}
.subhead{font-size:1.5rem;margin-block:64px 8px}

/* media page */
.videos{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.video{text-decoration:none;display:grid;gap:12px;min-width:0}
.video .th{position:relative;aspect-ratio:16/9;overflow:hidden}
.video .th img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.video:hover .th img{transform:scale(1.04)}
.video .play{position:absolute;left:16px;bottom:16px;width:56px;height:56px;border-radius:50%;background:var(--orange);display:grid;place-items:center}
.video .play::after{content:"";border-left:16px solid #181818;border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:4px}
.video h3{font-size:1.15rem}
.video p{color:var(--dim);font-size:.9rem}
@media (max-width:860px){.videos{grid-template-columns:1fr}}
.albums{display:grid;gap:64px}
.album h3{font-size:1.4rem;margin-bottom:4px}
.album .cred{color:var(--dim);font-size:.9rem;margin-bottom:18px}

/* om / timeline */
.timeline{display:grid;gap:0}
.tl{display:grid;grid-template-columns:110px 1fr;gap:24px;padding-block:22px;border-top:1px solid var(--line)}
.tl > *{min-width:0}
.tl .y{font-size:2rem;font-weight:900;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}
.tl h3{font-size:1.2rem;margin-bottom:6px}
.tl p{color:var(--mist);max-width:62ch}
.tl.dim .y{color:var(--dim-2)}
@media (max-width:560px){.tl{grid-template-columns:1fr;gap:6px}}

/* partners + contact */
.partners{display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
.partners div{overflow-wrap:anywhere;hyphens:auto;background:var(--ink-2);min-height:96px;display:grid;place-items:center;text-align:center;padding:16px;font-weight:700;color:var(--mist);font-size:1rem;min-width:0}
.partners.support div{color:var(--paper)}
@media (max-width:760px){.partners{grid-template-columns:1fr 1fr}}
.contact{display:grid;grid-template-columns:repeat(3,1fr);gap:32px}
.contact > div{border-top:3px solid var(--orange);padding-top:14px;display:grid;gap:6px;min-width:0;align-content:start}
.contact b{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.contact span{font-size:1.1rem;font-weight:700;overflow-wrap:anywhere;user-select:all}
.contact small{color:var(--dim);font-size:.9rem}
@media (max-width:760px){.contact{grid-template-columns:1fr}}

/* newsletter */
.news{display:flex;flex-wrap:wrap;gap:24px 48px;align-items:center;justify-content:space-between}
.news h2{font-size:clamp(1.8rem,3.6vw,2.6rem);max-width:18ch}
.news p{max-width:44ch;margin-top:10px}
.band-orange .btn{background:#181818;color:#fff;border-color:#181818}
.band-orange .btn:hover{background:transparent;color:#181818}

/* footer */
footer{border-top:1px solid var(--line);padding-block:48px 40px;color:var(--dim);font-size:.92rem}
footer .wrap{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:32px}
footer img{height:72px;width:auto}
footer b{color:var(--paper);display:block;margin-bottom:6px}
footer a{color:var(--mist)}
footer .fine{grid-column:1/-1;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:20px;font-size:.82rem}
@media (max-width:760px){footer .wrap{grid-template-columns:1fr}}

.page-hero{padding-block:64px 24px}
.page-hero h1{font-size:clamp(2.8rem,8vw,6rem);letter-spacing:-.03em;line-height:.95;margin-top:14px}
.page-hero p{color:var(--mist);max-width:56ch;margin-top:18px;font-size:1.1rem}


/* hero slideshow: first slide visible at rest */
.hero .bg img{position:absolute;inset:0}
.hero .bg img.s{opacity:0;animation:fade 24s infinite}
.hero .bg img.s1{animation-delay:6s}.hero .bg img.s2{animation-delay:12s}.hero .bg img.s3{animation-delay:18s}
@keyframes fade{0%{opacity:0}6%{opacity:1}25%{opacity:1}31%{opacity:0}100%{opacity:0}}
/* film strip */
.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.strip img{width:100%;aspect-ratio:3/4;object-fit:cover}
.strip img:nth-child(even){aspect-ratio:3/4;margin-top:36px}
@media (max-width:760px){.strip{grid-template-columns:repeat(3,1fr)}.strip img:nth-child(n+4){display:none}.strip img:nth-child(even){margin-top:20px}}
.fmt .fi{aspect-ratio:16/10;overflow:hidden;margin:-16px 0 6px;order:-1}
.fmt .fi img{width:100%;height:100%;object-fit:cover}
.fmt{border-top:0;padding-top:0}
.fmt h3{border-top:3px solid var(--orange);padding-top:12px}
/* TBA */
.tba{position:relative;overflow:hidden;min-height:420px;display:flex;align-items:flex-end;margin-bottom:56px}
.tba > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tba::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(24,24,24,.92) 0%,rgba(24,24,24,.6) 55%,rgba(24,24,24,.2) 100%)}
.tba .in{position:relative;z-index:1;padding:40px clamp(20px,4vw,48px);display:grid;gap:16px;max-width:620px}
.tba h2{font-size:clamp(2.2rem,5vw,3.6rem)}
.tba p{color:var(--mist)}
.tba .label,.tba .cta-row{justify-self:start}
.facts3{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.facts3 div{background:var(--ink-2);padding:24px;display:grid;gap:6px;min-width:0}
.facts3 b{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.facts3 span{font-size:1.35rem;font-weight:700;line-height:1.2}
.facts3 small{color:var(--dim);font-size:.92rem}
@media (max-width:820px){.facts3{grid-template-columns:1fr}}
.proto-toggle{font:inherit;font-size:.82rem;background:none;border:1px dashed var(--dim-2);color:var(--dim);padding:.35em .7em;cursor:pointer}
.aud{position:relative;overflow:hidden;padding-block:0}
.aud > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.aud::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(24,24,24,.94) 0%,rgba(24,24,24,.78) 55%,rgba(24,24,24,.45) 100%)}
.aud .wrap{position:relative;z-index:1;padding-block:96px}
.aud p.big{font-size:clamp(1.7rem,3.6vw,2.7rem);font-weight:700;line-height:1.22;letter-spacing:-.01em;max-width:28ch;text-wrap:balance}
.aud em{font-style:normal;color:var(--accent)}
.aud small{display:block;margin-top:22px;color:var(--mist);font-size:1rem}
.press-list{display:grid;gap:0}
.pitem{display:grid;grid-template-columns:1fr 240px;gap:32px;padding-block:30px;border-top:1px solid var(--line)}
.pitem > *{min-width:0}
.pitem p{font-size:clamp(1.15rem,2vw,1.45rem);font-weight:700;line-height:1.3}
.pitem .src{display:grid;gap:4px;align-content:start;font-size:.95rem}
.pitem .src b{color:var(--paper)}
.pitem .src span{color:var(--dim)}
.pitem .src a{color:var(--accent);font-weight:700;text-decoration:none;margin-top:6px}
.pitem .src a:hover{text-decoration:underline}
@media (max-width:700px){.pitem{grid-template-columns:1fr;gap:12px}}
.prev .pitem p{font-size:clamp(1.05rem,1.6vw,1.25rem)}
.prev .pitem{padding-block:22px}
.morelink{display:inline-flex;margin-top:40px;color:var(--accent);font-weight:700;text-decoration:none;border-bottom:2px solid var(--orange);padding-bottom:2px}
.day ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px}
.day li{display:grid;grid-template-columns:48px 1fr;gap:10px;font-size:.95rem;color:var(--mist)}
.day li span{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
.audq{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:48px;max-width:980px}
.audq blockquote{margin:0;font-size:1.08rem;line-height:1.45;color:var(--paper);border-top:2px solid var(--orange);padding-top:14px;min-width:0}
.audwho{margin-top:18px;color:var(--dim);font-size:.88rem}
@media (max-width:760px){.audq{grid-template-columns:1fr;gap:18px}}
.hl{padding-block:56px 0}
.carousel{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,300px);gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:16px;scrollbar-width:thin}
.carousel .person{scroll-snap-align:start}
.carousel .person .ph{aspect-ratio:4/5}
.hl-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.hl-head h2{font-size:clamp(1.6rem,3vw,2.2rem)}
.hl-nav{display:flex;gap:8px}
.hl-nav button{font:inherit;width:44px;height:44px;border:1.5px solid var(--line);background:none;color:var(--paper);cursor:pointer;font-size:1.1rem}
.hl-nav button:hover{border-color:var(--orange);color:var(--accent)}
.composers{margin-top:18px;color:var(--mist);font-size:.98rem}
.composers b{color:var(--accent);font-weight:700;margin-right:6px}
/* round 5 */
.pl{color:inherit;text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:3px;text-decoration-thickness:1.5px}
.pl:hover{color:var(--accent)}
.rm{font:inherit;font-size:.88rem;font-weight:700;background:none;border:0;padding:0;margin-top:8px;color:var(--accent);cursor:pointer}
.rm::after{content:" ↓"}.rm[aria-expanded="true"]::after{content:" ↑"}
.person{scroll-margin-top:96px}
.person p.also{font-size:.85rem;color:var(--dim);font-weight:700}
.dir p a{color:inherit;text-decoration-color:var(--accent);text-underline-offset:3px}
.person.flash .ph{outline:3px solid var(--accent);outline-offset:3px}
.ipe-text{columns:2 340px;column-gap:48px;color:var(--mist);max-width:none}
.ipe-text p{break-inside:avoid;margin-bottom:14px}
.members{display:grid;grid-template-columns:repeat(4,1fr);gap:36px 24px;margin-top:40px}
.member .ph{aspect-ratio:4/5}
.member details{font-size:.92rem}
.member .soon{color:var(--dim);margin-top:6px;font-style:italic}
@media (max-width:900px){.members{grid-template-columns:repeat(2,1fr)}}
.dir{display:grid;grid-template-columns:180px 1fr;gap:24px;margin-top:56px;padding-top:24px;border-top:1px solid var(--line)}
.dir h3{font-size:1.3rem;margin-bottom:6px}.dir p{color:var(--mist);max-width:62ch}
@media (max-width:600px){.dir{grid-template-columns:1fr;gap:8px}}
#ensemble{scroll-margin-top:68px}
.tl a.y{text-decoration:none}
.tl h3 a{text-decoration:none;color:inherit}.tl h3 a:hover,.tl a.y:hover{color:var(--accent)}
.partners a{overflow-wrap:anywhere;hyphens:auto;background:var(--ink-2);min-height:96px;display:grid;place-items:center;grid-auto-flow:column;gap:6px;text-align:center;padding:16px;font-weight:700;color:var(--paper);font-size:1rem;min-width:0;text-decoration:none;transition:background .15s}
.partners a span{color:var(--accent);font-size:.85em}
.partners a:hover{background:var(--ink-3)}
.cform-wrap{max-width:720px}
.cform{display:grid;gap:16px}
.cform h2,.cform-done h2{font-size:clamp(1.5rem,3vw,2rem);margin-bottom:6px}
.cform label{display:grid;gap:6px;font-size:.85rem;font-weight:700;letter-spacing:.04em;color:var(--mist)}
.cform input,.cform select,.cform textarea{font:inherit;font-size:1rem;font-weight:500;color:var(--paper);background:var(--ink-2);border:1.5px solid var(--line);padding:.7em .8em;border-radius:0;width:100%}
.cform input:focus,.cform select:focus,.cform textarea:focus{border-color:var(--accent);outline:none}
.cform .row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cform .btn{justify-self:start}
@media (max-width:600px){.cform .row2{grid-template-columns:1fr}}
.cform-done{border-left:3px solid var(--orange);padding:16px 20px;background:var(--ink-2)}
.play.listen::after{content:"♪";border:0;margin:0;color:#181818;font-size:1.6rem;font-weight:900;line-height:1}
.radio{grid-template-columns:repeat(3,1fr)}
.radio.two{grid-template-columns:repeat(2,1fr)}
@media (max-width:860px){.radio{grid-template-columns:1fr}}
.eyebrow.deco{display:flex;align-items:center;gap:14px}
.eyebrow.deco .dots{gap:5px}.eyebrow.deco .dots i{width:7px;height:7px}
.mbio{list-style:none;margin:2px 0 0;padding:0;display:grid;gap:3px;font-size:.88rem;color:var(--mist);line-height:1.4}
.mbio li::before{content:"· ";color:var(--accent);font-weight:900}
.dir-in{display:grid;grid-template-columns:160px 1fr;gap:24px;align-items:start}
.dir-in img{width:160px;aspect-ratio:4/5;object-fit:cover;object-position:52% 30%}
@media (max-width:600px){.dir-in{grid-template-columns:110px 1fr;gap:16px}.dir-in img{width:110px}}
.lb-open{display:block;width:100%;height:100%;padding:0;border:0;background:none;cursor:zoom-in}
.lb{position:fixed;inset:0;z-index:100;background:rgba(10,10,10,.94);display:grid;grid-template-columns:56px 1fr 56px;align-items:center;padding:24px 8px}
.lb[hidden]{display:none}
.lb figure{margin:0;display:grid;justify-items:center;gap:12px;min-width:0}
.lb img{max-width:100%;max-height:calc(100vh - 110px);object-fit:contain}
.lb figcaption{color:#cfcfcf;font-size:.88rem;letter-spacing:.02em}
.lb button{font:inherit;background:none;border:0;color:#fff;cursor:pointer}
.lb-nav{font-size:2.6rem;line-height:1;height:64px}
.lb-nav:hover,.lb-x:hover{color:var(--orange)}
.lb-x{position:absolute;top:10px;right:16px;font-size:2.2rem;line-height:1}
@media (max-width:600px){.lb{grid-template-columns:36px 1fr 36px;padding:16px 2px}.lb-nav{font-size:2rem}}
@media (max-width:480px){.brand img{height:15px}.top .wrap{gap:10px}.theme-btn{width:32px}}
.mbio{margin-top:8px}
.dotnav{position:fixed;right:22px;top:50%;transform:translateY(-50%);z-index:15;display:grid;gap:12px}
.dotnav[hidden]{display:none}
.dotnav button{display:flex;align-items:center;justify-content:flex-end;gap:10px;background:none;border:0;padding:2px;cursor:pointer;font:inherit}
.dotnav i{width:10px;height:10px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--orange);transition:background .2s,transform .2s}
.dotnav button.on i{background:var(--orange);transform:scale(1.15)}
.dotnav button:hover i{background:var(--orange)}
.dotnav span{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:rgba(24,24,24,.85);padding:.25em .6em;opacity:0;transform:translateX(6px);transition:opacity .15s,transform .15s;pointer-events:none;white-space:nowrap}
.dotnav button:hover span,.dotnav button:focus-visible span{opacity:1;transform:none}
@media (max-width:1100px),(hover:none){.dotnav{display:none!important}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function dots(pattern){ return `<span class="dots" aria-hidden="true">${pattern.split("").map(c=>`<i class="${c==='o'?'o':c==='w'?'w':''}"></i>`).join("")}</span>`; }

const slug = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/ø/g,"o").replace(/æ/g,"ae").replace(/å/g,"a").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
function personFor(name, y){
  const list = PEOPLE[y]||[];
  return list.find(p=>p.n===name) || list.find(p=>p.n.split(/ · | & | og /).includes(name)) || list.find(p=>p.n.includes(name));
}
function whoLinks(who, y){
  return who.split(" · ").map(n=>{
    if(n==="Interpuls Ensemble") return `<a class="pl" href="#om" data-goto="ensemble">${esc(n)}</a>`;
    const p = personFor(n, y);
    return p ? `<a class="pl" href="#medvirkende" data-person="${slug(p.n)}" data-pyear="${y}">${esc(n)}</a>` : esc(n);
  }).join(" · ");
}
function descHtml(e){
  const full = L(e.desc), extra = e.more ? L(e.more) : "";
  const i = full.indexOf(". ");
  const first = i>0 ? full.slice(0,i+1) : full, rest = (i>0 ? full.slice(i+2) : "") + (extra ? (i>0?" ":"") + extra : "");
  if(!rest) return `<p class="desc">${esc(full)}</p>`;
  return `<p class="desc">${esc(first)} <span class="rest" hidden>${esc(rest)}</span></p><button class="rm" aria-expanded="false" data-rm>${t("readBio")}</button>`;
}
const parts = n => n.split(/ · | & /);
const sameP = (a,b) => a.n===b.n || parts(a.n).some(x=>parts(b.n).includes(x));
function personCard(p, y, withBio=true){
  const ph = p.img ? `<img src="${IMG(p.img)}" alt="${esc(p.n)}" loading="lazy"${p.pos?` style="object-position:${p.pos}"`:""}>` : `<span class="mono">${p.n.split(/[ ·&]+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("")}</span>`;
  const other = withBio ? Object.keys(PEOPLE).filter(k=>k!=y && (RELEASED_2027||k!="2027") && PEOPLE[k].some(q=>sameP(q,p))).sort((a,b)=>b-a) : [];
  const also = other.length ? `<p class="also">${lang==="no"?"Også på Interpuls":"Also at Interpuls"}: ${other.map(k=>`<a class="pl" href="#medvirkende" data-person="${slug(PEOPLE[k].find(q=>sameP(q,p)).n)}" data-pyear="${k}">${k}</a>`).join(" · ")}</p>` : "";
  return `<article class="person" id="p-${y}-${slug(p.n)}"><div class="ph">${ph}</div><div class="role">${esc(L(p.r))}</div><h3>${esc(p.n)}</h3>${withBio?`<p>${esc(L(p.p))}</p>`:""}${also}</article>`;
}

function program(){
  if(!RELEASED_2027 && state.progYear==2027) state.progYear = "tba";
  if(RELEASED_2027 && state.progYear=="tba") state.progYear = 2027;
  const y = state.progYear, P = PROGRAM[y];
  const years = Object.keys(PROGRAM).filter(k=>RELEASED_2027 || k!="2027").sort((a,b)=>b-a);
  if(y==="tba"){
    return `<div class="wrap page-hero"><span class="label"><b>//</b> Interpuls 2027</span><h1>${t("progH")}</h1></div>
    <section style="padding-top:24px"><div class="wrap">${tbaPanel()}
      <h2 class="subhead" style="margin-top:0;margin-bottom:18px">${lang==="no"?"Tidligere festivaler":"Past festivals"}</h2>
      ${yearbar(years, null, "progYear")}</div></section>`;
  }
  let body = "";
  if(P.days){
    body = (P.prelim?`<p class="notice">${t("prelim")}</p>`:"") + P.days.map(day=>`
      <div class="dayblock">
        <div class="dname"><span>${esc(day.date)}</span><b>${L(day.d)}</b>${day.theme?`<em>${L(day.theme)}</em>`:""}</div>
        <div>${day.events.map(e=>`
          <article class="event" id="ev-${y}-${day.date.replace(/\./g,'')}-${e.t.replace(':','')}">
            <div class="img"><img src="${IMG(e.img)}" alt="" loading="lazy"></div>
            <div>
              <div class="time">${e.t}</div>
              <h3>${esc(L(e.h))}</h3>
              <div class="who">${whoLinks(e.who, y)}</div>
              ${descHtml(e)}
              ${e.pulses?`<ul class="pulses">${e.pulses.map(p=>`<li><span class="t">${p[0]}</span><span class="p">${p[1]}</span><span>${esc(L(p[2]))}</span></li>`).join("")}</ul>`:""}
              <div class="acts">
                ${y!=2027?"": e.sold?`<span class="tag sold">${t("soldout")}</span>`: e.url?`<a class="btn" href="${e.url}" target="_blank" rel="noopener">${t("buy")}</a>`: `<span class="tag">${t("soon")}</span>`}
                ${e.tag==="premiere"?`<span class="tag">${lang==="no"?"Urfremføring":"World premiere"}</span>`:""}
              </div>
            </div>
          </article>`).join("")}</div>
      </div>`).join("");
  } else {
    body = `<div class="dayblock"><div class="dname"><span>Interpuls</span><b>${y}</b><em>${t("hlTitle")}</em></div><div>
      <div class="highlights">${P.highlights.map(h=>`<div><h3>${esc(L(h[0]))}</h3><p>${esc(L(h[1]))}</p></div>`).join("")}</div>
      <p class="notice" style="margin-top:32px;margin-bottom:0">${t("archNote")}</p></div></div>`;
  }
  return `<div class="wrap page-hero"><span class="label"><b>//</b> Interpuls ${y}</span><h1>${t("progH")}</h1><p>${t("progP")}</p></div>
  <section style="padding-top:24px"><div class="wrap">${RELEASED_2027?"":`<p class="notice"><a href="#program" data-year="tba" data-key="progYear">${lang==="no"?"← Program 2027 kommer i desember":"← 2027 programme out in December"}</a></p>`}${yearbar(years, y, "progYear")}${body}</div></section>${newsBand()}`;
}

    <div class="videos">${vids().map(v=>`<a class="video" href="${v.url}" target="_blank" rel="noopener"><div class="th"><img src="${IMG(v.img)}" alt="" loading="lazy"><span class="play" aria-hidden="true"></span></div><h3>${esc(L(v.h))}</h3><p>${esc(L(v.p))}</p></a>`).join("")}</div>
    <h2 class="subhead" style="margin-bottom:8px">${t("radioH")}</h2>
    <p style="color:var(--mist);margin-bottom:22px">${lang==="no"?"Konsertopptak fra Interpuls og reportasje på NRK.":"Concert recordings from Interpuls and a feature on NRK."}</p>
    <div class="videos radio">${RADIO.map(v=>`<a class="video" href="${v.url}" target="_blank" rel="noopener"><div class="th"><img src="${IMG(v.img)}" alt="" loading="lazy"><span class="play listen" aria-hidden="true"></span></div><h3>${esc(L(v.h))}</h3><p>${esc(L(v.p))} →</p></a>`).join("")}</div>
    <h2 class="subhead" style="margin-bottom:22px">${t("albumsH")}</h2>
    <div class="albums">${ALBUMS.map(a=>{ const n=a.imgs.length;
      const cls = i => n<5 ? (i===0?'w3 h2':'w3') : (i===0?'w3 h2':i===1?'w3':'w2');
      return `<div class="album"><h3>${esc(L(a.h))}</h3><p class="cred">${esc(a.c)}</p>
      <div class="mosaic">${a.imgs.map((im,i)=>`<figure class="${cls(i)}"><button class="lb-open" data-lb="${im}" aria-label="${lang==="no"?"Vis bildet større":"View larger"}"><img src="${IMG(im)}" alt="" loading="lazy"></button></figure>`).join("")}</div></div>`;}).join("")}</div>
  </div></section>`;
}

function about(){
  return `<div class="wrap page-hero"><span class="label"><b>//</b> Interpuls</span><h1>${t("omH")}</h1></div>
  <section style="padding-top:24px"><div class="wrap split">
    <div>${dots("xxoxxoxx")}<p class="lead" style="margin-top:22px;font-size:1.35rem;line-height:1.45">${t("omLead")}</p>${t("omP").map(p=>`<p style="margin-top:16px">${p}</p>`).join("")}</div>
    <div class="photo-stack"><img class="a" src="${IMG('sh-08098')}" alt="Interpuls Ensemble"><img class="b" src="${IMG('ms-06319-enhanced')}" alt=""></div>
  </div></section>
  <section class="band-2" id="ensemble"><div class="wrap">
    <div class="sec-head"><div><div class="eyebrow">${lang==="no"?"Arrangøren":"The organiser"}</div><h2 style="margin-top:12px">${t("ipeH")}</h2></div></div>
    <div class="ipe-text">${t("ipeLong").map(p=>`<p>${p}</p>`).join("")}</div>
    <div class="members">${IPE.map(m=>`<article class="person member"><div class="ph">${m.img?`<img src="${IMG(m.img)}" alt="${esc(m.n)}" loading="lazy"${m.pos?` style="object-position:${m.pos}"`:""}>`:`<span class="mono">${m.n.split(/[ -]+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("")}</span>`}</div><div class="role">${esc(L(m.r))}</div><h3>${esc(m.n)}</h3>
      ${m.bio?`<details><summary>${t("readBio")}</summary><ul class="mbio">${L(m.bio).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></details>`:""}</article>`).join("")}
      <article class="person member guest"><div class="ph"><img src="${IMG('sh-08098')}" alt="" loading="lazy"></div><div class="role">${IPE_GUEST[lang][1]}</div><h3>${IPE_GUEST[lang][0]}</h3></article></div>
    <div class="dir">
      <div class="eyebrow">${t("dirH")}</div>
      <div class="dir-in"><img src="${IMG('m-daniel-dir')}" alt="Daniel Lyngstad" loading="lazy"><div><h3>Daniel Lyngstad</h3><p>${t("dirP")}</p></div></div>
    </div>
  </div></section>
  <section><div class="wrap">
    <div class="sec-head"><h2>${t("histH")}</h2><p>${t("histP")}</p></div>
    <div class="timeline">${TIMELINE.filter(r=>RELEASED_2027 || r[0]!=="2027").map(r=>{
      const y=r[0], linked = !!PROGRAM[y];
      const yr = linked ? `<a class="y" href="#program" data-year="${y}" data-key="progYear" data-route="program">${y}</a>` : `<div class="y">${y}</div>`;
      return `<div class="tl${r[3]?' dim':''}">${yr}<div><h3>${linked?`<a href="#program" data-year="${y}" data-key="progYear" data-route="program">${esc(L(r[1]))} →</a>`:esc(L(r[1]))}</h3><p>${esc(L(r[2]))}</p></div></div>`;}).join("")}</div>
  </div></section>
  ${audBand()}`;
}

function partners(){
  const cell = p => p.url ? `<a href="${p.url}" target="_blank" rel="noopener">${esc(p.n)}<span aria-hidden="true">↗</span></a>` : `<div>${esc(p.n)}</div>`;
  return `<div class="wrap page-hero"><span class="label"><b>//</b> Interpuls</span><h1>${t("conH")}</h1><p>${t("conP")}</p></div>
  <section style="padding-top:24px"><div class="wrap">
    <div class="eyebrow" style="margin-bottom:16px">${t("partH")}</div>
    <div class="partners">${PARTNERS.filter(p=>RELEASED_2027||p.tba).map(cell).join("")}</div>
    <div class="eyebrow" style="margin-block:44px 16px">${t("suppH")}</div>
    <div class="partners support">${SUPPORT.map(cell).join("")}</div>
  </div></section>`;
}
function contact(){
  return `<div class="wrap page-hero"><span class="label"><b>//</b> Interpuls</span><h1>${t("kH")}</h1><p>${t("kP")}</p></div>
  <section style="padding-top:24px"><div class="wrap">
    <div class="cform-wrap">
      <form class="cform" id="cform" name="kontakt" method="POST" data-netlify="true" netlify-honeypot="bot-field">
        <h2>${t("formH")}</h2>
        <input type="hidden" name="form-name" value="kontakt"><p hidden><label>Ikke fyll ut: <input name="bot-field"></label></p>
        <div class="row2"><label>${t("fName")}<input name="navn" required autocomplete="name"></label><label>${t("fEmail")}<input type="email" name="epost" required autocomplete="email"></label></div>
        <label>${t("fSubj")}<select name="emne">${t("fSubjects").map(o=>`<option>${o}</option>`).join("")}</select></label>
        <label>${t("fMsg")}<textarea name="melding" rows="6" required></textarea></label>
        <button class="btn" type="submit">${t("fSend")}</button>
      </form>
      <div class="cform-done" id="cdone" hidden><h2>${t("fThanks")}</h2></div>
    </div>
    <div class="eyebrow" style="margin-block:56px 18px">${t("orDirect")}</div>
    <div class="contact">
      <div><b>${t("cMail")}</b><span>hei@interpuls.no</span></div>
      <div><b>${t("cPhone")}</b><span>+47 986 70 803</span></div>
      <div><b>${t("cAddr")}</b><span>Kulturkirken Jakob</span><small>Hausmanns gate 14, 0182 Oslo</small></div>
    </div>
  </div></section>
  ${newsBand()}`;
}

const ROUTES = {hjem:home, program, medvirkende:people, bilder:media, presse:pressPage, om:about, partnere:partners, kontakt:contact};

function renderNav(cur){
  document.getElementById("mainNav").innerHTML = t("nav").map(([k,v])=>`<a href="#${k}" ${k===cur?'aria-current="page"':""}>${v}</a>`).join("");
  document.querySelectorAll("[data-i]").forEach(el=>{ el.textContent = t(el.dataset.i); });
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.lang===lang));
  document.documentElement.lang = lang==="no" ? "nb" : "en";
  const tb = document.getElementById("topBtn");
  if(RELEASED_2027){ tb.href="https://www.ticketmaster.no/"; tb.textContent=t("tickets"); } else { tb.href="http://eepurl.com/hXy6Rn"; tb.textContent=t("newsletter"); }
}
function renderFoot(){
  document.getElementById("foot").innerHTML = `
    <div><img class="logo-d" src="img/logo_full_white.png" alt="Interpuls"><img class="logo-l" src="img/logo_full.png" alt="Interpuls"><p style="margin-top:14px;max-width:34ch">${lang==="no"?"Festival for minimalistisk musikk i Kulturkirken Jakob, Oslo.":"Festival of minimalist music at Kulturkirken Jakob, Oslo."}</p></div>
    <div><b>${t("contactH")}</b>hei@interpuls.no<br>+47 986 70 803<br>Hausmanns gate 14, Oslo</div>
    <div><b>${t("follow")}</b><a href="https://www.instagram.com/interpuls_festival/" target="_blank" rel="noopener">Instagram</a><br><a href="https://www.facebook.com/interpulsfestival/" target="_blank" rel="noopener">Facebook</a><br><a href="http://eepurl.com/hXy6Rn" target="_blank" rel="noopener">${t("newsBtn")} (${lang==="no"?"nyhetsbrev":"newsletter"})</a></div>
    <div class="fine"><span>Interpuls · ${t("org")}</span>${IS_PROTO?`<span>${t("proto")} · <button class="proto-toggle" id="protoToggle">${RELEASED_2027?t("toggleOff"):t("toggleOn")}</button></span>`:`<span>© Interpuls</span>`}</div>`;
}
function route(){
  const key = (location.hash||"#hjem").slice(1);
  const page = ROUTES[key] ? key : "hjem";
  document.getElementById("app").innerHTML = ROUTES[page]();
  renderNav(page); renderFoot();
  document.getElementById("mainNav").classList.remove("open");
  document.getElementById("menuBtn").setAttribute("aria-expanded","false");
  return page;
}
function applyTheme(th){ document.documentElement.setAttribute("data-theme", th); }
let theme = "dark";
try{ const th = localStorage.getItem("ip-theme"); if(th==="light"||th==="dark") theme = th; }catch(e){}
applyTheme(theme);
let pendingScroll = null;
function doPendingScroll(){
  if(!pendingScroll) return false;
  const el = document.getElementById(pendingScroll); pendingScroll = null;
  if(!el) return false;
  el.scrollIntoView({block:"start"});
  if(el.classList.contains("person")){ el.classList.add("flash"); setTimeout(()=>el.classList.remove("flash"),1800); }
  return true;
}
function go(hash){
  if(location.hash === hash){ route(); if(!doPendingScroll()) window.scrollTo(0,0); }
  else location.hash = hash;
}
let lastPage = null;
window.addEventListener("hashchange", ()=>{ const p=route(); if(!doPendingScroll() && p!==lastPage){ window.scrollTo(0,0); } lastPage=p; });
document.addEventListener("click", e=>{
  const pl = e.target.closest("[data-person]");
  if(pl){ e.preventDefault(); state.pplYear = +pl.dataset.pyear; pendingScroll = `p-${pl.dataset.pyear}-${pl.dataset.person}`; go("#medvirkende"); return; }
  const gt = e.target.closest("[data-goto]");
  if(gt){ e.preventDefault(); pendingScroll = gt.dataset.goto; go("#om"); return; }
  const yb = e.target.closest("[data-year]");
  if(yb){ e.preventDefault(); const v=yb.dataset.year; state[yb.dataset.key] = v==="tba"?"tba":+v; if(yb.dataset.route){ go("#"+yb.dataset.route); return; } route(); window.scrollTo(0,0); return; }
  const rm = e.target.closest("[data-rm]");
  if(rm){ const r = rm.previousElementSibling.querySelector(".rest"); const open = r.hidden; r.hidden = !open; rm.setAttribute("aria-expanded", open); rm.textContent = open ? t("readLess") : t("readBio"); return; }
  if(e.target.closest("#themeBtn")){ theme = theme==="dark"?"light":"dark"; applyTheme(theme); try{localStorage.setItem("ip-theme",theme)}catch(_){ } return; }
  const sc = e.target.closest("[data-scroll]");
  if(sc){ const c=document.getElementById("carousel"); if(c) c.scrollBy({left:+sc.dataset.scroll*c.clientWidth*0.8,behavior:"smooth"}); return; }
  if(e.target.closest("#protoToggle")){ RELEASED_2027 = !RELEASED_2027; state.progYear = RELEASED_2027?2027:"tba"; state.pplYear = RELEASED_2027?2027:2026; route(); return; }
  const lo = e.target.closest("[data-lb]");
  if(lo){ const all=[...(lo.closest(".album")||document).querySelectorAll("[data-lb]")].map(b=>b.dataset.lb); lbOpen(all, all.indexOf(lo.dataset.lb)); return; }
  if(e.target.closest("[data-lbx]") || e.target.id==="lb"){ lbClose(); return; }
  const st = e.target.closest("[data-lbstep]");
  if(st){ lbGo(+st.dataset.lbstep); return; }
  const lb = e.target.closest(".lang button");
  if(lb){ lang = lb.dataset.lang; try{localStorage.setItem("ip-lang",lang)}catch(_){ } route(); return; }
  if(e.target.closest("#menuBtn")){ const n=document.getElementById("mainNav"); const o=n.classList.toggle("open"); e.target.closest("#menuBtn").setAttribute("aria-expanded",o); }
});
const DN = {no:{hero:"Til toppen",intro:"Om festivalen",fmt:"Formatet",aud:"Publikum",video:"Video",press:"Presse",gallery:"Bilder",news:"Nyhetsbrev"},
            en:{hero:"Back to top",intro:"About",fmt:"The format",aud:"Audience",video:"Video",press:"Press",gallery:"Photos",news:"Newsletter"}};
let dnObs = null;
function buildDotnav(page){
  const nav = document.getElementById("dotnav"); if(dnObs){ dnObs.disconnect(); dnObs=null; }
  const secs = page==="hjem" ? [...document.querySelectorAll("#app [data-dn]")] : [];
  if(!secs.length){ nav.hidden = true; nav.innerHTML=""; return; }
  nav.hidden = false;
  nav.innerHTML = secs.map((s,i)=>`<button data-dnto="${i}" aria-label="${DN[lang][s.dataset.dn]}"><span>${DN[lang][s.dataset.dn]}</span><i></i></button>`).join("");
  const btns = [...nav.querySelectorAll("button")];
  const setActive = i => btns.forEach((b,j)=>b.classList.toggle("on", j===i));
  setActive(0);
  dnObs = new IntersectionObserver(es=>{ es.forEach(en=>{ if(en.isIntersecting) setActive(secs.indexOf(en.target)); }); }, {rootMargin:"-45% 0px -50% 0px"});
  secs.forEach(s=>dnObs.observe(s));
  nav.onclick = e=>{ const b=e.target.closest("[data-dnto]"); if(!b) return; const t=secs[+b.dataset.dnto]; window.scrollTo({top: t.getBoundingClientRect().top + scrollY - 68, behavior:"smooth"}); };
}
let LB = {list:[], i:0};
function lbShow(){ const im = LB.list[LB.i]; document.getElementById("lbImg").src = IMG(im); document.getElementById("lbCap").textContent = (lang==="no"?"Foto: ":"Photo: ") + credit(im) + `  ·  ${LB.i+1} / ${LB.list.length}`; }
function lbOpen(list,i){ LB = {list, i:Math.max(0,i)}; lbShow(); const l=document.getElementById("lb"); l.hidden=false; document.body.style.overflow="hidden"; l.querySelector(".lb-x").focus(); }
function lbClose(){ document.getElementById("lb").hidden=true; document.body.style.overflow=""; }
function lbGo(d){ LB.i = (LB.i + d + LB.list.length) % LB.list.length; lbShow(); }
document.addEventListener("keydown", e=>{ if(document.getElementById("lb").hidden) return; if(e.key==="Escape") lbClose(); if(e.key==="ArrowRight") lbGo(1); if(e.key==="ArrowLeft") lbGo(-1); });
let tx=null; document.getElementById("lb").addEventListener("touchstart",e=>{tx=e.touches[0].clientX},{passive:true});
document.getElementById("lb").addEventListener("touchend",e=>{ if(tx===null) return; const dx=e.changedTouches[0].clientX-tx; if(Math.abs(dx)>50) lbGo(dx<0?1:-1); tx=null; });
lastPage = route();
document.addEventListener("submit", e=>{
  if(e.target.id!=="cform") return;
  e.preventDefault();
  const f = e.target, done = () => { f.hidden = true; document.getElementById("cdone").hidden = false; };
  if(IS_PROTO){ done(); return; }
  fetch("/", {method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"}, body:new URLSearchParams(new FormData(f)).toString()})
    .then(r=>{ if(!r.ok) throw 0; done(); })
    .catch(()=>{ alert(lang==="no"?"Noe gikk galt. Send oss gjerne en e-post på hei@interpuls.no.":"Something went wrong. Please email us at hei@interpuls.no."); });
});
</script>
