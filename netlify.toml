# GENERERT – rediger kilden og bygg på nytt i stedet for å endre denne fila.
[build]
  publish = "."

# Gjeldende år (endres ved programslipp)
[[redirects]]
  from = "/medvirkende"
  to = "/medvirkende/2026"
  status = 302
[[redirects]]
  from = "/en/medvirkende"
  to = "/en/medvirkende/2026"
  status = 302

# Gamle adresser fra forrige nettside (gjelder bare stier som ikke finnes som filer)
[[redirects]]
  from = "/program/*"
  to = "/program"
  status = 301
[[redirects]]
  from = "/medvirkende/*"
  to = "/medvirkende"
  status = 301
[[redirects]]
  from = "/en/program/*"
  to = "/en/program"
  status = 301
[[redirects]]
  from = "/en/medvirkende/*"
  to = "/en/medvirkende"
  status = 301
[[redirects]]
  from = "/aktuelt/*"
  to = "/bilder"
  status = 301
[[redirects]]
  from = "/aktuelt"
  to = "/bilder"
  status = 301
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
